name: Signal G7

on:
  # БОЕВОЙ режим: каждый час через 5 минут после закрытия 1H-свечи (время UTC)
  schedule:
    - cron: "5 * * * *"

  # РУЧНОЙ запуск (кнопка Run workflow во вкладке Actions)
  workflow_dispatch:
    inputs:
      mode: "trend"
        description: "dry = тест (всё в Telegram, позиции не пишутся) · backtest = бэктест в Telegram · run = боевой вручную"
        type: choice
        options: [dry, backtest, run]
        default: dry
      ict_bar:
        description: "Таймфрейм ICT-входа"
        type: choice
        options: ["1H", "4H"]
        default: "1H"
      ict_min_rr:
        description: "Мин. RR до цели-ликвидности (чем выше, тем реже и крупнее сигналы)"
        default: "3.0"
      bt_days:
        description: "Бэктест: сколько дней истории (на 1H больше 400 — очень долго)"
        default: "400"
      bt_top:
        description: "Бэктест: сколько самых ликвидных монет"
        default: "40"

permissions:
  contents: write        # чтобы сохранять signal_g7_state.json в репозиторий

concurrency:
  group: signal-g7       # два запуска одновременно не пересекаются
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run signal_g7
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE_IN: ${{ github.event.inputs.mode }}
          # при ручном запуске берутся из полей выше, по расписанию — значения справа от ||
          ICT_BAR: ${{ github.event.inputs.ict_bar || '1H' }}
          ICT_MIN_RR: ${{ github.event.inputs.ict_min_rr || '3.0' }}
          BT_DAYS: ${{ github.event.inputs.bt_days || '400' }}
          BT_TOP: ${{ github.event.inputs.bt_top || '40' }}
          # ---- параметры стратегии (меняйте здесь) ----
          MODE: "ict"               # ict | trend | hybrid
          EQUITY_USDT: "1000"       # ваш счёт
          RISK_PCT: "0.5"           # риск на сделку, % счёта
          MAX_LEVERAGE: "3"
          MAX_OPEN: "6"             # одновременных позиций
          MAX_NEW_PER_RUN: "2"
          MAX_PER_DAY: "3"          # не больше N сигналов за 24 часа
          SYMBOL_COOLDOWN_DAYS: "2"
          TOP_N: "0"                # 0 = все монеты OKX
          MIN_TURNOVER_USDT: "5000000"
          ALLOW_SHORT: "0"          # 1 = разрешить шорты при медвежьем BTC
          REQUIRE_BYBIT: "0"        # сверка с Bybit выключена (доступ заблокирован)
        run: |
          case "$MODE_IN" in
            dry)      python signal_g7.py --dry ;;
            backtest) python signal_g7.py --backtest --dry ;;
            *)        python signal_g7.py ;;      # расписание и режим run = БОЕВОЙ запуск
          esac

      - name: Save state
        if: github.event_name == 'schedule' || github.event.inputs.mode == 'run'
        run: |
          if [ -f signal_g7_state.json ] && [ -n "$(git status --porcelain signal_g7_state.json)" ]; then
            git config user.name  "signal-bot"
            git config user.email "signal-bot@users.noreply.github.com"
            git add signal_g7_state.json
            git commit -m "state: signal_g7 [skip ci]"
            git pull --rebase
            git push
          fi
