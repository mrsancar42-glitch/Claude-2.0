name: Signal G7

on:
  schedule:
    # каждые 4 часа через 5 минут после закрытия 4H-свечи (время UTC)
    - cron: "5 0,4,8,12,16,20 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry = пробный прогон в Telegram, backtest = бэктест в Telegram, run = боевой"
        type: choice
        options: [dry, backtest, run]
        default: dry

permissions:
  contents: write        # нужно, чтобы сохранить signal_g7_state.json в репозиторий

concurrency:
  group: signal-g7       # два запуска одновременно не пересекаются
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run signal_g7
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE_IN: ${{ github.event.inputs.mode }}
          # при желании меняйте параметры здесь:
          EQUITY_USDT: "1000"
          RISK_PCT: "1.0"
          MAX_LEVERAGE: "3"
          # ALLOW_SHORT: "1"
        run: |
          case "$MODE_IN" in
            dry)      python signal_g7.py --dry ;;
            backtest) python signal_g7.py --backtest --dry ;;
            *)        python signal_g7.py ;;     # расписание и режим run: боевой запуск
          esac

      - name: Save state
        if: github.event_name == 'schedule' || github.event.inputs.mode == 'run'
        run: |
          if [ -f signal_g7_state.json ] && [ -n "$(git status --porcelain signal_g7_state.json)" ]; then
            git config user.name  "signal-bot"
            git config user.email "signal-bot@users.noreply.github.com"
            git add signal_g7_state.json
            git commit -m "state: signal_g7 [skip ci]"
            git pull --rebase
            git push
          fi
